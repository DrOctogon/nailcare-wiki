name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # dangerouslyAllowAllBuilds: pnpm v11 exits non-zero if any dependency's
        # native build script is unapproved. In this ephemeral CI runner we trust
        # the locked deps and let them all build (esbuild powers vitest, the eslint
        # resolver needs its binary, etc.).
        run: pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

# Note: `pnpm build` is intentionally omitted — static generation reads the
# private Obsidian vault (a sibling checkout that isn't available in CI). Lint,
# typecheck, and the Vitest suite all run without it; the vault-dependent
# `vault.test.ts` self-skips when the vault is absent.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # dangerouslyAllowAllBuilds: pnpm v11 exits non-zero if any dependency's
        # native build script is unapproved. In this ephemeral CI runner we trust
        # the locked deps and let them all build (esbuild powers vitest, the eslint
        # resolver needs its binary, etc.).
        run: pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      # Build and E2E run against a tiny synthetic fixture vault checked into the
      # repo (test/fixtures/vault), pointed at via WIKI_VAULT_PATH. This lets CI
      # exercise static generation and Playwright without the private Obsidian
      # vault, which isn't available on the runner.
      - name: Build
        run: pnpm exec next build
        env:
          WIKI_VAULT_PATH: ${{ github.workspace }}/test/fixtures/vault

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm exec playwright test
        env:
          WIKI_VAULT_PATH: ${{ github.workspace }}/test/fixtures/vault
          CI: true
